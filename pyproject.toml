[tool.poetry]
package-mode = false
name = "embedding_models_performance_test"
version = "0.1.0"
description = "Benchmark de performance modular para modelos de embeddings locais com FastAPI."
authors = ["Kenny Mar <kennymar@exemplo.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.1"}
pydantic = "^2.7.4"
python-multipart = "^0.0.9"
sentence-transformers = "^3.0.1"
transformers = "^4.40.0"
torch = ">=2.0.0"
pymupdf = "^1.24.0"
python-docx = "^1.1.2"
numpy = "^1.26.0"
pandas = "^2.2.0"
matplotlib = "^3.9.0"
seaborn = "^0.13.0"
psutil = "^5.9.0"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-asyncio = "^0.23.7"
flake8 = "^7.1.0"
isort = "^5.13.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

